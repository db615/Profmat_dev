[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "professor-auth-service"
version = "0.1.0"
description = "Independent authentication service for Professor Search"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    "google-auth[requests]>=2.38,<3",
    "PyMySQL>=1.1.2,<2",
    "pydantic-settings>=2.8,<3",
    "pydantic[email]>=2.10,<3",
    "PyJWT[crypto]>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0.38,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/api/**/*.py" = ["B008"]