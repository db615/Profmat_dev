resolver 127.0.0.11 valid=10s ipv6=off;

upstream auth_backend {
    zone auth_backend 64k;
    server auth:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    etag off;
    sub_filter '__CSP_NONCE__' '$request_id';
    sub_filter_once on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'nonce-$request_id' https://accounts.google.com/gsi/style; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;

    location /api/ {
        proxy_pass http://auth_backend;
    }

    location = /health/ready {
        proxy_pass http://auth_backend;
    }

    location = /health/frontend {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}